name: X Code 0.1.27 Windows x64 packaging
on:
  push:
    branches: [release-build/x-code-0.1.27]
permissions:
  contents: read
  actions: read
jobs:
  reuse_verified_payloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        artifact: [js-bundle, cli-linux-x64, native-windows-resource-monitor]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: 46065260632
          github-token: ${{ github.token }}
          name: ${{ matrix.artifact }}
          path: payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.artifact }}
          path: payload
          if-no-files-found: error
          compression-level: 0
  desktop_win_x64:
    needs: reuse_verified_payloads
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: "0.1.27"
      ref: a8954a490306058ab610ce0124895f4b0156086f
      release_channel: stable
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      relay_client_tracing: false
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
