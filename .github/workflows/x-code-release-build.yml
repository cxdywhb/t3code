name: X Code 0.1.28 macOS arm64 packaging

on:
  push:
    branches: [release-build/x-code-0.1.28]

permissions:
  contents: read
  actions: read

jobs:
  reuse_js_bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: 46170365144
          github-token: ${{ github.token }}
          name: js-bundle
          path: payload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: js-bundle
          path: payload
          if-no-files-found: error
          compression-level: 0

  desktop_mac_arm64:
    needs: [reuse_js_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: "0.1.28"
      ref: 4f14ce4876c58a481dcdf0f9f19d5cbcdb1f5c66
      release_channel: stable
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      relay_client_tracing: false
      label: macOS arm64
      runner: macos-26
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: false
      launch_check: true
