name: X Code 0.1.26 Windows x64 packaging
on:
  push:
    branches: [release-build/x-code-0.1.26]
permissions:
  contents: read
  actions: read
jobs:
  bundle_and_wsl:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        artifact: [js-bundle, cli-linux-x64]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.artifact }}
          path: payload
          run-id: 45966416582
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.artifact }}
          path: payload
          if-no-files-found: error
          compression-level: 0
  native_resource_monitor:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Check out release source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/cxdywhb/t3code.git"
          git fetch --no-tags --depth=1 origin 767f9393cc329db90b2d8482fd810bf0627ee36b
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Build native Windows x64 resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-windows-resource-monitor
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          if-no-files-found: error
  desktop_win_x64:
    needs: [bundle_and_wsl, native_resource_monitor]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: "0.1.26"
      ref: 767f9393cc329db90b2d8482fd810bf0627ee36b
      release_channel: stable
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      relay_client_tracing: false
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
