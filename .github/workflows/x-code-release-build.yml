name: X Code 0.1.28 release publisher

on:
  push:
    branches: [release-build/x-code-0.1.28]

permissions:
  contents: write
  actions: read

jobs:
  publish_v0_1_28:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out release source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin 4f14ce4876c58a481dcdf0f9f19d5cbcdb1f5c66
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download verified Windows x64 artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: 46170365144
          github-token: ${{ github.token }}
          name: desktop-win-x64
          path: artifacts/win

      - name: Download verified macOS arm64 artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: 46171149296
          github-token: ${{ github.token }}
          name: desktop-mac-arm64
          path: artifacts/mac

      - name: Prepare updater manifests and publish v0.1.28 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la artifacts/mac artifacts/win
          if [[ ! -f artifacts/win/latest.yml && -f artifacts/win/latest-win-x64.yml ]]; then
            cp artifacts/win/latest-win-x64.yml artifacts/win/latest.yml
          fi
          cat > release-notes.md <<'EOF'
          ## 本版更新

          - **PR 审查与 Issue 自动化**：整合 PR 审查并完善 Issue 自动化工作台，优化禅道配置弹窗与回写对话框卡片布局。
          - **侧栏、输入区与看板**：优化模型选择器并支持从侧栏移除项目，增加项目会话排序选项，优化会话输入区与用量看板，默认保留全局指令与共享 Codex 技能/MCP 能力。
          - **同步主干 `upstream/main`**：合入主干（`9b8d4f30be8`），带来多仓库 `trackedFolders` 支持、PR 列表时间窗口筛选、云端 MR 跨账号发现、Codex App Server 技能/MCP 加载、macOS 内存压力监控及波兰语多语言目录等更新，并修复多仓库 `requireProject` 精确匹配问题。

          ## 安装

          - **macOS Apple Silicon**：通过 `X-Code-0.1.28-arm64.dmg` 手动安装或覆盖（应用使用临时签名）。
          - **Windows x64**：通过 `X-Code-0.1.28-x64.exe` 安装（内含 Linux x64 WSL 后端运行时，已通过 `windows-2025` 实机验证）。
          - 使用 `SHA256SUMS.txt` 校验全部安装包与清单文件哈希。
          EOF
          if ! gh release view v0.1.28 --repo cxdywhb/t3code >/dev/null 2>&1; then
            gh release create v0.1.28 \
              --repo cxdywhb/t3code \
              --target 4f14ce4876c58a481dcdf0f9f19d5cbcdb1f5c66 \
              --prerelease \
              --title "X Code v0.1.28" \
              --notes-file release-notes.md
          fi
          node scripts/publish-xcode-prerelease-assets.ts 0.1.28 \
            --mac-dir artifacts/mac \
            --win-dir artifacts/win \
            --generate-mac-manifest \
            --publish
