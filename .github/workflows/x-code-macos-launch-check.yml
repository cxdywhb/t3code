name: X Code v0.1.27 macOS launch check
on:
  push:
    branches: [release-build/x-code-0.1.27-mac-smoke]
permissions:
  contents: write
jobs:
  launch:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - name: Check out release verification scripts
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...
      - name: Download the installer from the release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/461050709" --jq '.assets[]|select(.name=="X-Code-0.1.27-arm64.dmg")|.id')
          test -n "$asset"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$RUNNER_TEMP/X-Code-0.1.27-arm64.dmg"
      - name: Check the packaged macOS app
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/x-code-release-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$RUNNER_TEMP/X-Code-0.1.27-arm64.dmg"
          trap 'hdiutil detach "$mount" >/dev/null || true' EXIT
          app="$mount/X Code.app"
          codesign --verify --deep --strict "$app"
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          node scripts/smoke-desktop-app.ts --executable "$app/Contents/MacOS/$exe" --artifacts-dir "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: macos-launch-diagnostics
          path: ${{ runner.temp }}/smoke
