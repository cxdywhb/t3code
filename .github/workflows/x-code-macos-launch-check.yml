name: X Code v0.1.27 macOS launch check
on:
  push:
    branches: [release-build/x-code-0.1.27-mac-smoke]
permissions:
  contents: read
jobs:
  launch:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...
      - name: Check the packaged macOS app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.1.27 -R "$GITHUB_REPOSITORY" -p X-Code-0.1.27-arm64.dmg -D "$RUNNER_TEMP"
          mount="$RUNNER_TEMP/x-code-release-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$RUNNER_TEMP/X-Code-0.1.27-arm64.dmg"
          trap 'hdiutil detach "$mount" >/dev/null || true' EXIT
          app="$mount/X Code.app"
          codesign --verify --deep --strict "$app"
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          node scripts/smoke-desktop-app.ts --executable "$app/Contents/MacOS/$exe" --artifacts-dir "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: macos-launch-diagnostics
          path: ${{ runner.temp }}/smoke
